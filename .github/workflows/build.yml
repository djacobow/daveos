name: Build and test
on: [push, pull_request]
permissions:
  contents: read
env:
  UV_CACHE_DIR: ${{ github.workspace }}/build/uv-cache
jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, 'address,undefined', thread]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install meson==1.10.1 ninja==1.13.0 uv==0.9.28
      - run: uv pip install --system -r requirements-test.txt
      - if: matrix.sanitizer == 'none'
        run: sudo apt-get update && sudo apt-get install -y clang-format-15
      # Ubuntu 24.04's cppcheck 2.13 cannot expand C++20 __VA_OPT__.
      - name: Build pinned cppcheck
        if: matrix.sanitizer == 'none'
        run: |
          mkdir -p build/ci-tools
          curl --fail --location --retry 3 https://github.com/cppcheck-opensource/cppcheck/archive/refs/tags/2.19.0.tar.gz --output build/ci-tools/cppcheck-2.19.0.tar.gz
          echo 'c6cff9d3bbcb3da941bf7f525ae974b6c7af3d610c4c5519fcd1be3f21f5ae09  build/ci-tools/cppcheck-2.19.0.tar.gz' | sha256sum --check
          tar -xzf build/ci-tools/cppcheck-2.19.0.tar.gz -C build/ci-tools
          cmake -S build/ci-tools/cppcheck-2.19.0 -B build/ci-tools/cppcheck-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/ci-tools/cppcheck" -DBUILD_GUI=OFF -DBUILD_TESTS=OFF
          cmake --build build/ci-tools/cppcheck-build --parallel 2
          cmake --install build/ci-tools/cppcheck-build
          build/ci-tools/cppcheck/bin/cppcheck --version
          echo "$PWD/build/ci-tools/cppcheck/bin" >> "$GITHUB_PATH"
      - run: git submodule update --init net/lwip storage/fatfs
      - run: meson setup build/host --native-file meson/clang.ini -Db_sanitize=${{ matrix.sanitizer }} -Db_lundef=false -Dnetworking=true -Dfatfs=true -Dversion_build="$GITHUB_RUN_NUMBER"
      - run: meson compile -C build/host -j 2
      - run: meson test -C build/host --print-errorlogs
      - if: matrix.sanitizer == 'none'
        run: meson compile -C build/host format-check lint
      - if: matrix.sanitizer == 'none'
        run: |
          meson setup build/fake --native-file meson/clang.ini -Dplatform=fake
          meson compile -C build/fake -j 2
          meson test -C build/fake --print-errorlogs
          meson setup build/no-logging --native-file meson/clang.ini -Dlogging=false -Dfatfs=true
          meson test -C build/no-logging --print-errorlogs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ strategy.job-index }}
          path: build/*/meson-logs/
  arm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install meson==1.10.1 ninja==1.13.0 uv==0.9.28
      - run: uv pip install --system -r requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib
      - run: |
          git submodule update --init platform/stm32h5/STM32CubeH5 platform/stm32/STM32_USB_Device_Library storage/fatfs
          git -C platform/stm32h5/STM32CubeH5 submodule update --init --recursive Drivers/CMSIS/Device/ST/STM32H5xx Drivers/STM32H5xx_HAL_Driver
      - run: meson setup build/arm --cross-file meson/stm32.ini -Dexamples=true -Dversion_build="$GITHUB_RUN_NUMBER"
      - run: meson compile -C build/arm
      - name: Build optional read-only H563 SD fixture
        run: |
          meson configure build/arm -Dspi_sd_probe=true -Dfatfs=true
          meson compile -C build/arm
          meson configure build/arm -Dspi_sd_probe=false -Dfatfs=false
      - run: |
          git submodule update --init platform/stm32h7/STM32CubeH7
          git -C platform/stm32h7/STM32CubeH7 submodule update --init --recursive Drivers/CMSIS/Device/ST/STM32H7xx Drivers/STM32H7xx_HAL_Driver
      - run: meson setup build/h755 --cross-file meson/stm32.ini -Dboard=h755 -Dexamples=true -Dversion_build="$GITHUB_RUN_NUMBER"
      - run: meson compile -C build/h755
      - name: Switch boards without replacing the cross file
        run: |
          meson configure build/arm -Dboard=h755
          meson compile -C build/arm flash-plan
          meson configure build/arm -Dboard=h563
          meson compile -C build/arm flash-plan
      - name: Build independent console combinations
        run: |
          for options in 'true false' 'false true' 'false false'; do
            set -- $options
            for target in arm h755; do
              meson configure build/$target -Duart_console="$1" -Dusb_console="$2"
              meson compile -C build/$target
            done
          done
      - name: Build optional networking on both STM32 families
        run: |
          git submodule update --init net/lwip platform/stm32/lan8742
          for target in arm h755; do
            meson configure build/$target -Dnetworking=true -Duart_console=true -Dusb_console=true
            meson compile -C build/$target
            meson configure build/$target -Duart_console=false -Dusb_console=false -Dlogging=false
            meson compile -C build/$target
            meson configure build/$target -Duart_console=true -Dusb_console=true -Dlogging=true -Dtcp_console=false
            meson compile -C build/$target
            meson configure build/$target -Duart_console=false -Dusb_console=false
            meson compile -C build/$target
          done
      - name: Build A/B bootloader and verify CI version propagation
        run: |
          for board in h563 h755; do
            meson setup build/boot-$board --cross-file meson/stm32.ini -Dboard="$board" -Dexamples=true -Dbootloader=true -Dnetworking=true -Dversion_build="$GITHUB_RUN_NUMBER"
            meson compile -C build/boot-$board -j 2
            meson compile -C build/boot-$board flash-plan
            python tools/verify_version.py --build build/boot-$board --number "$GITHUB_RUN_NUMBER"
          done
      - name: Build standalone device starters
        run: |
          python -B -m pytest tests/starter/test_starter.py --starter-board h563 --starter-work "$PWD/build/device-starters"
          python -B -m pytest tests/starter/test_starter.py --starter-board h755 --starter-work "$PWD/build/device-starters"
