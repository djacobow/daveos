name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, 'address,undefined', thread]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install meson==1.10.1 ninja==1.13.0
      - run: sudo apt-get update && sudo apt-get install -y clang-format-15 cppcheck
      - run: meson setup build/host --native-file meson/clang.ini -Db_sanitize=${{ matrix.sanitizer }} -Db_lundef=false
      - run: meson compile -C build/host -j 2
      - run: meson test -C build/host --print-errorlogs
      - if: matrix.sanitizer == 'none'
        run: meson compile -C build/host format-check lint
      - if: matrix.sanitizer == 'none'
        run: |
          meson setup build/fake --native-file meson/clang.ini -Dplatform=fake
          meson compile -C build/fake -j 2
          meson test -C build/fake --print-errorlogs
          meson setup build/no-logging --native-file meson/clang.ini -Dlogging=false
          meson test -C build/no-logging --print-errorlogs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ strategy.job-index }}
          path: build/*/meson-logs/
  arm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install meson==1.10.1 ninja==1.13.0
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libstdc++-arm-none-eabi-dev libstdc++-arm-none-eabi-newlib
      - run: |
          git submodule update --init platform/stm32h5/STM32CubeH5
          git -C platform/stm32h5/STM32CubeH5 submodule update --init --recursive Drivers/CMSIS/Device/ST/STM32H5xx Drivers/STM32H5xx_HAL_Driver
      - run: meson setup build/arm --cross-file meson/stm32h563.ini -Dexamples=true
      - run: meson compile -C build/arm
      - run: |
          git submodule update --init platform/stm32h7/STM32CubeH7
          git -C platform/stm32h7/STM32CubeH7 submodule update --init --recursive Drivers/CMSIS/Device/ST/STM32H7xx Drivers/STM32H7xx_HAL_Driver
      - run: meson setup build/h755 --cross-file meson/stm32h755.ini -Dexamples=true
      - run: meson compile -C build/h755
