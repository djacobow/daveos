# Everything available on both boards: A/B firmware, networking, SD/FatFs and
# updates over TCP or from an SD file. Board-specific fixtures (i2c-adc) and
# OTP backends are added explicitly.
[project options]
bootloader = true
features = ['uart', 'usb', 'health', 'net', 'tcp', 'sd', 'sd-dma', 'fatfs', 'file-transfer', 'ota']
