[constants]
cpu_flags = ['-mcpu=cortex-m33', '-mthumb', '-mfpu=fpv5-sp-d16', '-mfloat-abi=hard']
compile_flags = cpu_flags + ['-ffreestanding', '-ffunction-sections', '-fdata-sections']
link_flags = cpu_flags + ['--specs=nano.specs', '--specs=nosys.specs']

[binaries]
c = 'arm-none-eabi-gcc'
cpp = 'arm-none-eabi-g++'
ar = 'arm-none-eabi-ar'
strip = 'arm-none-eabi-strip'
objcopy = 'arm-none-eabi-objcopy'

[host_machine]
system = 'baremetal'
cpu_family = 'arm'
cpu = 'cortex-m33'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_std = 'gnu11'
c_args = compile_flags
cpp_args = compile_flags
c_link_args = link_flags
cpp_link_args = link_flags

[project options]
platform = 'stm32h5'
tests = false
examples = false
