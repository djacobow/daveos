[binaries]
c = 'arm-none-eabi-gcc'
cpp = 'arm-none-eabi-g++'
ar = 'arm-none-eabi-ar'
strip = 'arm-none-eabi-strip'

[host_machine]
system = 'baremetal'
cpu_family = 'arm'
cpu = 'cortex-m33'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
cpp_args = ['-mcpu=cortex-m33', '-mthumb', '-mfloat-abi=soft', '-ffreestanding']
cpp_link_args = ['-mcpu=cortex-m33', '-mthumb', '-mfloat-abi=soft', '--specs=nosys.specs']

[project options]
platform = 'stm32h5'
tests = false
examples = false
