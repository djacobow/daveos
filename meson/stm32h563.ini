[binaries]
c = 'arm-none-eabi-gcc'
cpp = 'arm-none-eabi-g++'
ar = 'arm-none-eabi-ar'
strip = 'arm-none-eabi-strip'
objcopy = 'arm-none-eabi-objcopy'

[host_machine]
system = 'baremetal'
cpu_family = 'arm'
cpu = 'cortex-m33'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_std = 'gnu11'
c_args = ['-mcpu=cortex-m33', '-mthumb', '-mfpu=fpv5-sp-d16', '-mfloat-abi=hard', '-ffreestanding', '-ffunction-sections', '-fdata-sections']
cpp_args = ['-mcpu=cortex-m33', '-mthumb', '-mfpu=fpv5-sp-d16', '-mfloat-abi=hard', '-ffreestanding', '-ffunction-sections', '-fdata-sections']
c_link_args = ['-mcpu=cortex-m33', '-mthumb', '-mfpu=fpv5-sp-d16', '-mfloat-abi=hard', '--specs=nano.specs', '--specs=nosys.specs']
cpp_link_args = ['-mcpu=cortex-m33', '-mthumb', '-mfpu=fpv5-sp-d16', '-mfloat-abi=hard', '--specs=nano.specs', '--specs=nosys.specs']

[project options]
platform = 'stm32h5'
tests = false
examples = false
